[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent"
version = "0.1.0"
description = "CodeAgent — 自研小型 AI Coding Agent（参考 Claude Code 源码架构）"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
    "typer>=0.12",
    "GitPython>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["agent*", "app*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
